<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" width="520" height="260" font-family="monospace, sans-serif">
  <rect width="520" height="260" fill="#0f172a" rx="12"/>
  <text x="260" y="26" font-size="14" font-weight="bold" fill="#f1f5f9" text-anchor="middle">Onda Senoidal — v(t) = Vₘ sin(ωt + φ)</text>
  <!-- Grid -->
  <line x1="50" y1="130" x2="480" y2="130" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="50" y1="80"  x2="480" y2="80"  stroke="#1e293b" stroke-width="1"/>
  <line x1="50" y1="180" x2="480" y2="180" stroke="#1e293b" stroke-width="1"/>
  <!-- Axes -->
  <line x1="50"  y1="30"  x2="50"  y2="220" stroke="#475569" stroke-width="1.5"/>
  <line x1="50"  y1="130" x2="490" y2="130" stroke="#475569" stroke-width="1.5"/>
  <text x="495" y="134" font-size="10" fill="#64748b">t</text>
  <text x="42"  y="34"  font-size="10" fill="#64748b" text-anchor="end">V</text>
  <!-- Sine wave path (2 full cycles, amplitude=50px) -->
  <path d="M50,130 C77,130 77,80 105,80 C133,80 133,180 161,180 C189,180 189,80 217,80 C245,80 245,180 273,180 C301,180 301,80 329,80 C357,80 357,180 385,180 C413,180 413,80 441,80 C469,80 469,130 480,130"
    fill="none" stroke="#a78bfa" stroke-width="2.5"/>
  <!-- Amplitude annotation -->
  <line x1="105" y1="80" x2="105" y2="130" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="110" y="100" font-size="10" fill="#fbbf24">Vm</text>
  <!-- Period annotation -->
  <line x1="50"  y1="215" x2="270" y2="215" stroke="#38bdf8" stroke-width="1.5"/>
  <polygon points="50,215 58,211 58,219"  fill="#38bdf8"/>
  <polygon points="270,215 262,211 262,219" fill="#38bdf8"/>
  <text x="155" y="228" font-size="10" fill="#38bdf8" text-anchor="middle">T = 1/f</text>
  <!-- Labels -->
  <text x="42" y="83"  font-size="9" fill="#64748b" text-anchor="end">+Vm</text>
  <text x="42" y="183" font-size="9" fill="#64748b" text-anchor="end">−Vm</text>
  <!-- Vpp -->
  <line x1="460" y1="80" x2="460" y2="180" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="465" y="134" font-size="9" fill="#4ade80">Vpp=2Vm</text>
  <!-- Key params box -->
  <rect x="55" y="38" width="200" height="30" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="155" y="55" font-size="9" fill="#94a3b8" text-anchor="middle">V_rms = Vm / √2 ≈ 0.707 Vm</text>
</svg>
