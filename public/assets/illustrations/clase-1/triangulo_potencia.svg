<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" width="320" height="280" font-family="monospace, sans-serif">
  <rect width="320" height="280" fill="#0f172a" rx="12"/>
  <text x="160" y="26" font-size="14" font-weight="bold" fill="#f1f5f9" text-anchor="middle">Triángulo de Potencia</text>
  <!-- Triangle -->
  <polygon points="160,50 40,230 280,230" fill="none" stroke="#fbbf24" stroke-width="2.5"/>
  <!-- Divider -->
  <line x1="100" y1="170" x2="220" y2="170" stroke="#fbbf24" stroke-width="2"/>
  <!-- P top -->
  <rect x="130" y="58" width="60" height="40" rx="8" fill="#1c1400" stroke="#fbbf24" stroke-width="2"/>
  <text x="160" y="83" font-size="22" fill="#fbbf24" font-weight="bold" text-anchor="middle">P</text>
  <!-- V bottom-left -->
  <rect x="60" y="180" width="60" height="40" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="90" y="205" font-size="22" fill="#38bdf8" font-weight="bold" text-anchor="middle">V</text>
  <!-- I bottom-right -->
  <rect x="198" y="180" width="60" height="40" rx="8" fill="#1e293b" stroke="#4ade80" stroke-width="2"/>
  <text x="228" y="205" font-size="22" fill="#4ade80" font-weight="bold" text-anchor="middle">I</text>
  <!-- × symbol -->
  <text x="160" y="215" font-size="16" fill="#64748b" text-anchor="middle">×</text>
  <!-- Formulas -->
  <rect x="40" y="248" width="240" height="26" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="160" y="264" font-size="11" fill="#94a3b8" text-anchor="middle">P = V·I   |   V = P/I   |   I = P/V</text>
  <!-- Units -->
  <text x="160" y="242" font-size="9" fill="#475569" text-anchor="middle">P[W] = V[V] × I[A]  →  también P = I²R = V²/R</text>
</svg>
