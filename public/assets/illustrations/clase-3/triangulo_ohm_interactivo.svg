<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" width="320" height="280" font-family="monospace, sans-serif">
  <rect width="320" height="280" fill="#0f172a" rx="12"/>
  <text x="160" y="26" font-size="14" font-weight="bold" fill="#f1f5f9" text-anchor="middle">Triángulo de Ohm</text>
  <!-- Triangle -->
  <polygon points="160,50 40,230 280,230" fill="none" stroke="#a78bfa" stroke-width="2.5"/>
  <!-- Divider line (horizontal) -->
  <line x1="100" y1="170" x2="220" y2="170" stroke="#a78bfa" stroke-width="2"/>
  <!-- V top -->
  <rect x="130" y="58" width="60" height="40" rx="8" fill="#1e40af" stroke="#38bdf8" stroke-width="2"/>
  <text x="160" y="83" font-size="22" fill="#38bdf8" font-weight="bold" text-anchor="middle">V</text>
  <!-- I bottom-left -->
  <rect x="62"  y="180" width="60" height="40" rx="8" fill="#064e3b" stroke="#4ade80" stroke-width="2"/>
  <text x="92"  y="205" font-size="22" fill="#4ade80" font-weight="bold" text-anchor="middle">I</text>
  <!-- R bottom-right -->
  <rect x="198" y="180" width="60" height="40" rx="8" fill="#3b0764" stroke="#a78bfa" stroke-width="2"/>
  <text x="228" y="205" font-size="22" fill="#a78bfa" font-weight="bold" text-anchor="middle">R</text>
  <!-- Multiplication dot -->
  <text x="160" y="215" font-size="16" fill="#64748b" text-anchor="middle">×</text>
  <!-- Division line inside -->
  <text x="160" y="165" font-size="13" fill="#64748b" text-anchor="middle">─────────</text>
  <!-- Formulas below -->
  <text x="160" y="252" font-size="11" fill="#94a3b8" text-anchor="middle">V = I × R  |  I = V/R  |  R = V/I</text>
  <text x="160" y="268" font-size="10" fill="#475569" text-anchor="middle">Cubre la incógnita para ver la fórmula</text>
</svg>
