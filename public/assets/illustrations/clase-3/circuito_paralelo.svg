<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" role="img" aria-label="Circuito en paralelo">
  <!-- Ilustración superior (estilo didáctico) -->
  <g transform="translate(20,10)">
    <!-- Fuente/batería -->
    <rect x="0" y="70" width="40" height="60" rx="4" fill="#f7b267" stroke="#cf6a2e" stroke-width="2"/>
    <text x="20" y="105" text-anchor="middle" font-size="12" fill="#2b2b2b">+</text>
    <!-- Cable a ramas -->
    <path d="M40 100 H120" stroke="#2b7bb9" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M120 100 V60 H300 V100" stroke="#2b7bb9" stroke-width="6" fill="none"/>
    <!-- Bombilla rama superior -->
    <g transform="translate(200,30)">
      <circle cx="30" cy="30" r="18" fill="#fff3d6" stroke="#e6a919" stroke-width="3"/>
      <rect x="26" y="46" width="8" height="14" rx="2" fill="#333"/>
    </g>
    <!-- Bombilla rama inferior -->
    <g transform="translate(200,90)">
      <circle cx="30" cy="30" r="18" fill="#fff3d6" stroke="#e6a919" stroke-width="3"/>
      <rect x="26" y="46" width="8" height="14" rx="2" fill="#333"/>
    </g>
    <!-- retorno al negativo -->
    <path d="M300 100 H420 V130 H0 V100 H40" stroke="#2b7bb9" stroke-width="6" fill="none" stroke-linejoin="round"/>
  </g>

  <!-- Ilustración inferior (esquema) -->
  <g transform="translate(40,160)">
    <!-- linea hasta nodo -->
    <line x1="0" y1="10" x2="80" y2="10" stroke="#111" stroke-width="2"/>
    <!-- nodo y ramas -->
    <circle cx="100" cy="10" r="4" fill="#111"/>
    <line x1="100" y1="10" x2="180" y2="-10" stroke="#111" stroke-width="2"/>
    <line x1="100" y1="10" x2="180" y2="30" stroke="#111" stroke-width="2"/>
    <!-- resistencias en cada rama -->
    <rect x="180" y="-18" width="40" height="16" fill="none" stroke="#111" stroke-width="2"/>
    <rect x="180" y="22" width="40" height="16" fill="none" stroke="#111" stroke-width="2"/>
    <!-- regreso de ramas al nodo -->
    <line x1="220" y1="-10" x2="300" y2="10" stroke="#111" stroke-width="2"/>
    <line x1="220" y1="30" x2="300" y2="10" stroke="#111" stroke-width="2"/>
    <line x1="300" y1="10" x2="340" y2="10" stroke="#111" stroke-width="2"/>
    <line x1="340" y1="10" x2="340" y2="40" stroke="#111" stroke-width="2"/>
    <line x1="340" y1="40" x2="0" y2="40" stroke="#111" stroke-width="2"/>
    <line x1="0" y1="40" x2="0" y2="10" stroke="#111" stroke-width="2"/>
  </g>
</svg>
