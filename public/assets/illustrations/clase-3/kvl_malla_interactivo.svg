<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" width="460" height="300" font-family="monospace, sans-serif">
  <rect width="460" height="300" fill="#0f172a" rx="12"/>
  <text x="230" y="26" font-size="14" font-weight="bold" fill="#f1f5f9" text-anchor="middle">LVK — Malla Interactiva</text>

  <!-- Circuit rectangle -->
  <line x1="70"  y1="65"  x2="390" y2="65"  stroke="#475569" stroke-width="2"/>
  <line x1="70"  y1="230" x2="390" y2="230" stroke="#475569" stroke-width="2"/>
  <line x1="70"  y1="65"  x2="70"  y2="230" stroke="#475569" stroke-width="2"/>
  <line x1="390" y1="65"  x2="390" y2="230" stroke="#475569" stroke-width="2"/>

  <!-- Vs (left vertical) -->
  <line x1="70" y1="65"  x2="70" y2="100" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="70" cy="130" r="25" stroke="#38bdf8" stroke-width="2" fill="none"/>
  <text x="70" y="126" font-size="12" fill="#38bdf8" text-anchor="middle">+</text>
  <text x="70" y="139" font-size="9"  fill="#38bdf8" text-anchor="middle">Vs=12V</text>
  <line x1="70" y1="155" x2="70" y2="230" stroke="#38bdf8" stroke-width="2"/>
  <text x="38" y="134" font-size="9" fill="#38bdf8" text-anchor="end">+12V ↑</text>

  <!-- R1 top horizontal -->
  <line x1="90"  y1="65" x2="135" y2="65" stroke="#a78bfa" stroke-width="2"/>
  <polyline points="135,65 142,53 150,77 158,53 166,77 174,53 182,77 190,65" stroke="#a78bfa" stroke-width="2" fill="none"/>
  <line x1="190" y1="65" x2="240" y2="65" stroke="#a78bfa" stroke-width="2"/>
  <text x="162" y="49" font-size="10" fill="#a78bfa" text-anchor="middle">R1=4Ω</text>
  <text x="162" y="88" font-size="9"  fill="#f87171" text-anchor="middle">−4V</text>

  <!-- R2 top horizontal (cont.) -->
  <line x1="240" y1="65" x2="290" y2="65" stroke="#a78bfa" stroke-width="2"/>
  <polyline points="290,65 297,53 305,77 313,53 321,77 329,53 337,77 345,65" stroke="#a78bfa" stroke-width="2" fill="none"/>
  <line x1="345" y1="65" x2="380" y2="65" stroke="#a78bfa" stroke-width="2"/>
  <text x="317" y="49" font-size="10" fill="#a78bfa" text-anchor="middle">R2=6Ω</text>
  <text x="317" y="88" font-size="9"  fill="#f87171" text-anchor="middle">−6V</text>

  <!-- R3 right vertical -->
  <line x1="390" y1="75"  x2="390" y2="100" stroke="#4ade80" stroke-width="2"/>
  <polyline points="390,100 378,108 402,116 378,124 402,132 378,140 402,148 390,156" stroke="#4ade80" stroke-width="2" fill="none"/>
  <line x1="390" y1="156" x2="390" y2="230" stroke="#4ade80" stroke-width="2"/>
  <text x="410" y="130" font-size="10" fill="#4ade80">R3=2Ω</text>
  <text x="353" y="130" font-size="9"  fill="#f87171" text-anchor="end">−2V</text>

  <!-- Mesh arrow -->
  <path d="M 180 140 A 80 50 0 1 1 280 180" stroke="#fbbf24" stroke-width="1.5" fill="none" stroke-dasharray="5,3"/>
  <polygon points="280,180 272,170 290,174" fill="#fbbf24"/>
  <text x="218" y="178" font-size="11" fill="#fbbf24" font-weight="bold">I=1A ↻</text>

  <!-- Ground -->
  <line x1="230" y1="230" x2="230" y2="245" stroke="#64748b" stroke-width="2"/>
  <line x1="218" y1="245" x2="242" y2="245" stroke="#64748b" stroke-width="3"/>

  <!-- Balance -->
  <rect x="70" y="258" width="320" height="32" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="230" y="270" font-size="10" fill="#94a3b8" text-anchor="middle">LVK:  +12V − 4V − 6V − 2V = 0  ✓</text>
  <text x="230" y="284" font-size="9"  fill="#475569" text-anchor="middle">∑V = 0 en toda malla cerrada</text>
</svg>
