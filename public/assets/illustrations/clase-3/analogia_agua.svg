<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" width="520" height="280" font-family="monospace, sans-serif">
  <rect width="520" height="280" fill="#0f172a" rx="12"/>
  <text x="260" y="26" font-size="14" font-weight="bold" fill="#f1f5f9" text-anchor="middle">Analogía Hidráulica — Ley de Ohm</text>

  <!-- Pipe top -->
  <rect x="60"  y="90"  width="400" height="30" rx="5" fill="#1e3a5f" stroke="#38bdf8" stroke-width="1.5"/>
  <!-- Pipe bottom -->
  <rect x="60"  y="160" width="400" height="30" rx="5" fill="#1e3a5f" stroke="#38bdf8" stroke-width="1.5"/>
  <!-- Narrowing (R) in center -->
  <polygon points="220,90 300,105 300,175 220,190" fill="#3b0764" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="260" y="135" font-size="11" fill="#a78bfa" text-anchor="middle">Estrechamiento</text>
  <text x="260" y="149" font-size="10" fill="#a78bfa" text-anchor="middle">= Resistencia R</text>

  <!-- Pump (pressure source) on left -->
  <rect x="20" y="88" width="50" height="104" rx="8" fill="#1c2d45" stroke="#38bdf8" stroke-width="2"/>
  <text x="45" y="128" font-size="10" fill="#38bdf8" text-anchor="middle">Bomba</text>
  <text x="45" y="142" font-size="10" fill="#38bdf8" text-anchor="middle">= Voltaje</text>
  <text x="45" y="156" font-size="11" fill="#38bdf8" text-anchor="middle" font-weight="bold">V</text>
  <!-- Pump arrows -->
  <polygon points="70,115 80,105 80,125" fill="#38bdf8"/>
  <polygon points="70,155 80,145 80,165" fill="#38bdf8"/>

  <!-- Flow arrows (water current) in pipe -->
  <text x="155" y="118" font-size="16" fill="#7dd3fc">→</text>
  <text x="155" y="185" font-size="16" fill="#7dd3fc">←</text>
  <text x="355" y="118" font-size="16" fill="#7dd3fc">→</text>
  <text x="355" y="185" font-size="16" fill="#7dd3fc">←</text>
  <text x="260" y="80" font-size="10" fill="#7dd3fc" text-anchor="middle">Caudal = Corriente I</text>

  <!-- Pressure labels -->
  <text x="115" y="145" font-size="10" fill="#fbbf24" text-anchor="middle">Alta presión</text>
  <text x="115" y="158" font-size="10" fill="#fbbf24" text-anchor="middle">(entrada)</text>
  <text x="405" y="145" font-size="10" fill="#64748b" text-anchor="middle">Baja presión</text>
  <text x="405" y="158" font-size="10" fill="#64748b" text-anchor="middle">(salida)</text>

  <!-- Right cap -->
  <rect x="460" y="88" width="40" height="104" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>

  <!-- Equivalences table -->
  <line x1="40" y1="222" x2="480" y2="222" stroke="#334155" stroke-width="1"/>
  <text x="130" y="240" font-size="11" fill="#38bdf8" text-anchor="middle">Presión → V</text>
  <text x="260" y="240" font-size="11" fill="#7dd3fc" text-anchor="middle">Caudal → I</text>
  <text x="390" y="240" font-size="11" fill="#a78bfa" text-anchor="middle">Estrechamiento → R</text>
  <text x="260" y="264" font-size="10" fill="#64748b" text-anchor="middle">Mayor presión con misma R → mayor caudal (I = V / R)</text>
</svg>
