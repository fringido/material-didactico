<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" width="480" height="280" font-family="monospace, sans-serif">
  <rect width="480" height="280" fill="#0f172a" rx="12"/>
  <text x="240" y="26" font-size="14" font-weight="bold" fill="#f1f5f9" text-anchor="middle">Circuito en Paralelo — Mismo Voltaje</text>
  <!-- Top rail -->
  <line x1="50" y1="65" x2="430" y2="65" stroke="#475569" stroke-width="2"/>
  <!-- Bottom rail -->
  <line x1="50" y1="225" x2="430" y2="225" stroke="#475569" stroke-width="2"/>
  <!-- Vs left -->
  <line x1="65" y1="65"  x2="65" y2="100" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="65" cy="130" r="25" stroke="#38bdf8" stroke-width="2" fill="none"/>
  <text x="65" y="126" font-size="12" fill="#38bdf8" text-anchor="middle">+</text>
  <text x="65" y="140" font-size="9"  fill="#38bdf8" text-anchor="middle">Vs=12V</text>
  <line x1="65" y1="155" x2="65" y2="225" stroke="#38bdf8" stroke-width="2"/>
  <!-- R1 branch -->
  <line x1="160" y1="65"  x2="160" y2="95"  stroke="#a78bfa" stroke-width="2"/>
  <polyline points="160,95 148,103 172,111 148,119 172,127 148,135 172,143 160,151" stroke="#a78bfa" stroke-width="2" fill="none"/>
  <line x1="160" y1="151" x2="160" y2="225" stroke="#a78bfa" stroke-width="2"/>
  <text x="182" y="125" font-size="11" fill="#a78bfa">R1=6Ω</text>
  <text x="130" y="130" font-size="9" fill="#7dd3fc" text-anchor="end">I₁=2A↓</text>
  <!-- R2 branch -->
  <line x1="270" y1="65"  x2="270" y2="95"  stroke="#4ade80" stroke-width="2"/>
  <polyline points="270,95 258,103 282,111 258,119 282,127 258,135 282,143 270,151" stroke="#4ade80" stroke-width="2" fill="none"/>
  <line x1="270" y1="151" x2="270" y2="225" stroke="#4ade80" stroke-width="2"/>
  <text x="292" y="125" font-size="11" fill="#4ade80">R2=4Ω</text>
  <text x="240" y="130" font-size="9" fill="#7dd3fc" text-anchor="end">I₂=3A↓</text>
  <!-- R3 branch -->
  <line x1="380" y1="65"  x2="380" y2="95"  stroke="#fbbf24" stroke-width="2"/>
  <polyline points="380,95 368,103 392,111 368,119 392,127 368,135 392,143 380,151" stroke="#fbbf24" stroke-width="2" fill="none"/>
  <line x1="380" y1="151" x2="380" y2="225" stroke="#fbbf24" stroke-width="2"/>
  <text x="398" y="125" font-size="11" fill="#fbbf24">R3=12Ω</text>
  <text x="350" y="130" font-size="9" fill="#7dd3fc" text-anchor="end">I₃=1A↓</text>
  <!-- Total current -->
  <text x="105" y="58" font-size="10" fill="#7dd3fc" text-anchor="middle">I_T=6A→</text>
  <!-- Voltage label -->
  <text x="240" y="248" font-size="11" fill="#94a3b8" text-anchor="middle">V=12V en TODAS las ramas  |  I_T = I₁+I₂+I₃ = 6A</text>
  <text x="240" y="265" font-size="10" fill="#475569" text-anchor="middle">R_eq = (6×4×12)/(6×4+4×12+12×6) ≈ 2Ω</text>
</svg>
