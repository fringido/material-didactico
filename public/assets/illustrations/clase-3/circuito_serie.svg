<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 220" role="img" aria-label="Circuito en serie">
  <!-- Ilustración superior (estilo didáctico) -->
  <g transform="translate(20,10)">
    <!-- Fuente/batería -->
    <rect x="0" y="60" width="40" height="60" rx="4" fill="#f7b267" stroke="#cf6a2e" stroke-width="2"/>
    <text x="20" y="95" text-anchor="middle" font-size="12" fill="#2b2b2b">+</text>
    <!-- Cable superior -->
    <path d="M40 90 H140" stroke="#d6455b" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- Bombilla 1 -->
    <g transform="translate(140,60)">
      <circle cx="30" cy="30" r="18" fill="#fff3d6" stroke="#e6a919" stroke-width="3"/>
      <rect x="26" y="46" width="8" height="14" rx="2" fill="#333"/>
    </g>
    <!-- conexión a siguiente bombilla -->
    <path d="M208 90 H300" stroke="#d6455b" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- Bombilla 2 -->
    <g transform="translate(300,60)">
      <circle cx="30" cy="30" r="18" fill="#fff3d6" stroke="#e6a919" stroke-width="3"/>
      <rect x="26" y="46" width="8" height="14" rx="2" fill="#333"/>
    </g>
    <!-- vuelta al negativo de la batería -->
    <path d="M338 90 H420 V140 H0 V90 H40" stroke="#d6455b" stroke-width="6" fill="none" stroke-linejoin="round"/>
  </g>

  <!-- Ilustración inferior (esquema) -->
  <g transform="translate(40,150)">
    <line x1="0" y1="10" x2="60" y2="10" stroke="#111" stroke-width="2"/>
    <!-- batería simbólica -->
    <g transform="translate(60, -6)">
      <rect x="0" y="4" width="6" height="12" fill="#000"/>
      <rect x="10" y="2" width="3" height="16" fill="#000"/>
    </g>
    <line x1="76" y1="10" x2="140" y2="10" stroke="#111" stroke-width="2"/>
    <!-- resistencia 1 -->
    <rect x="140" y="2" width="40" height="16" fill="none" stroke="#111" stroke-width="2"/>
    <line x1="180" y1="10" x2="220" y2="10" stroke="#111" stroke-width="2"/>
    <!-- resistencia 2 -->
    <rect x="220" y="2" width="40" height="16" fill="none" stroke="#111" stroke-width="2"/>
    <line x1="260" y1="10" x2="340" y2="10" stroke="#111" stroke-width="2"/>
    <!-- cierre del circuito -->
    <line x1="340" y1="10" x2="340" y2="40" stroke="#111" stroke-width="2"/>
    <line x1="340" y1="40" x2="0" y2="40" stroke="#111" stroke-width="2"/>
    <line x1="0" y1="40" x2="0" y2="10" stroke="#111" stroke-width="2"/>
  </g>
</svg>
