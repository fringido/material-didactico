<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="400" height="280" font-family="monospace, sans-serif">
  <rect width="400" height="280" fill="#0f172a" rx="12"/>
  <text x="200" y="26" font-size="14" font-weight="bold" fill="#f1f5f9" text-anchor="middle">Divisor de Tensión</text>
  <!-- Top wire -->
  <line x1="80"  y1="60"  x2="320" y2="60"  stroke="#475569" stroke-width="2"/>
  <!-- Bottom wire -->
  <line x1="80"  y1="220" x2="320" y2="220" stroke="#475569" stroke-width="2"/>
  <!-- Vs left vertical -->
  <line x1="95"  y1="60"  x2="95"  y2="95"  stroke="#38bdf8" stroke-width="2"/>
  <circle cx="95" cy="125" r="25" stroke="#38bdf8" stroke-width="2" fill="none"/>
  <text x="95" y="121" font-size="11" fill="#38bdf8" text-anchor="middle">+</text>
  <text x="95" y="135" font-size="9"  fill="#38bdf8" text-anchor="middle">Vin</text>
  <line x1="95"  y1="150" x2="95"  y2="220" stroke="#38bdf8" stroke-width="2"/>
  <text x="68"  y="128" font-size="10" fill="#38bdf8" text-anchor="end">12V</text>
  <!-- R1 vertical -->
  <line x1="200" y1="60"  x2="200" y2="90"  stroke="#a78bfa" stroke-width="2"/>
  <polyline points="200,90 188,98 212,106 188,114 212,122 188,130 212,138 200,146" stroke="#a78bfa" stroke-width="2" fill="none"/>
  <line x1="200" y1="146" x2="200" y2="160" stroke="#a78bfa" stroke-width="2"/>
  <text x="220" y="118" font-size="11" fill="#a78bfa">R1=8Ω</text>
  <text x="168" y="118" font-size="9"  fill="#f87171" text-anchor="end">8V</text>
  <!-- Node (output point) -->
  <circle cx="200" cy="160" r="6" fill="#fbbf24"/>
  <!-- R2 vertical -->
  <line x1="200" y1="166" x2="200" y2="185" stroke="#4ade80" stroke-width="2"/>
  <polyline points="200,185 188,192 212,199 188,206 212,213 200,220" stroke="#4ade80" stroke-width="2" fill="none"/>
  <text x="220" y="200" font-size="11" fill="#4ade80">R2=4Ω</text>
  <text x="168" y="200" font-size="9"  fill="#f87171" text-anchor="end">4V</text>
  <!-- Vout output -->
  <line x1="200" y1="160" x2="290" y2="160" stroke="#fbbf24" stroke-width="2"/>
  <circle cx="290" cy="160" r="5" fill="#fbbf24"/>
  <text x="305" y="155" font-size="11" fill="#fbbf24">Vout</text>
  <text x="305" y="170" font-size="10" fill="#fbbf24">= 4V</text>
  <!-- Ground -->
  <line x1="200" y1="220" x2="200" y2="233" stroke="#64748b" stroke-width="2"/>
  <line x1="188" y1="233" x2="212" y2="233" stroke="#64748b" stroke-width="3"/>
  <line x1="193" y1="238" x2="207" y2="238" stroke="#64748b" stroke-width="2"/>
  <!-- Formula -->
  <rect x="60" y="252" width="280" height="22" rx="5" fill="#1e293b" stroke="#334155"/>
  <text x="200" y="267" font-size="11" fill="#94a3b8" text-anchor="middle">Vout = Vin × R2/(R1+R2) = 12 × 4/12 = 4V</text>
</svg>
