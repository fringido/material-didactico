<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" width="520" height="280" font-family="monospace, sans-serif">
  <rect width="520" height="280" fill="#0f172a" rx="12"/>
  <text x="260" y="26" font-size="14" font-weight="bold" fill="#f1f5f9" text-anchor="middle">Convención de Signos — LVK</text>

  <!-- LEFT panel: Source convention -->
  <rect x="15" y="45" width="230" height="215" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="130" y="68" font-size="12" fill="#38bdf8" text-anchor="middle" font-weight="bold">Fuente de Voltaje</text>

  <!-- Source symbol -->
  <circle cx="90" cy="130" r="28" stroke="#38bdf8" stroke-width="2" fill="none"/>
  <text x="90" y="126" font-size="14" fill="#38bdf8" text-anchor="middle">+</text>
  <text x="90" y="142" font-size="11" fill="#38bdf8" text-anchor="middle">Vs</text>
  <line x1="90" y1="90" x2="90" y2="102" stroke="#38bdf8" stroke-width="2"/>
  <line x1="90" y1="158" x2="90" y2="175" stroke="#38bdf8" stroke-width="2"/>

  <!-- Arrow direction -->
  <text x="130" y="105" font-size="10" fill="#4ade80">→ Recorrer − a +</text>
  <text x="130" y="120" font-size="11" fill="#4ade80" font-weight="bold">  ↑ Subida (+V)</text>
  <text x="130" y="148" font-size="10" fill="#f87171">→ Recorrer + a −</text>
  <text x="130" y="163" font-size="11" fill="#f87171" font-weight="bold">  ↓ Caída (−V)</text>

  <text x="130" y="220" font-size="9" fill="#94a3b8" text-anchor="middle">La fuente SUBE el potencial</text>
  <text x="130" y="234" font-size="9" fill="#94a3b8" text-anchor="middle">cuando se recorre del − al +</text>

  <!-- RIGHT panel: Resistor convention -->
  <rect x="275" y="45" width="230" height="215" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="390" y="68" font-size="12" fill="#a78bfa" text-anchor="middle" font-weight="bold">Resistencia</text>

  <!-- Resistor symbol horizontal -->
  <line x1="295" y1="130" x2="330" y2="130" stroke="#a78bfa" stroke-width="2"/>
  <polyline points="330,130 337,118 345,142 353,118 361,142 369,118 377,142 385,130" stroke="#a78bfa" stroke-width="2" fill="none"/>
  <line x1="385" y1="130" x2="420" y2="130" stroke="#a78bfa" stroke-width="2"/>
  <text x="358" y="115" font-size="10" fill="#a78bfa" text-anchor="middle">R</text>

  <!-- Current arrow same direction -->
  <text x="295" y="110" font-size="10" fill="#4ade80">I →</text>
  <text x="390" y="155" font-size="10" fill="#f87171" text-anchor="middle">Recorrer en sentido I</text>
  <text x="390" y="170" font-size="11" fill="#f87171" font-weight="bold" text-anchor="middle">↓ Caída (−IR)</text>

  <!-- Current arrow opposite -->
  <text x="420" y="110" font-size="10" fill="#f87171" text-anchor="end">← I</text>
  <text x="390" y="195" font-size="10" fill="#4ade80" text-anchor="middle">Recorrer opuesto a I</text>
  <text x="390" y="210" font-size="11" fill="#4ade80" font-weight="bold" text-anchor="middle">↑ Subida (+IR)</text>

  <!-- Bottom rule -->
  <text x="260" y="272" font-size="10" fill="#64748b" text-anchor="middle">Elige una dirección de malla y mantén la misma regla en todo el circuito</text>
</svg>
