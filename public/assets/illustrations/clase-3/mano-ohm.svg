<svg width="100%" viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="">
  <defs>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="4" dy="4" stdDeviation="6" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Palma de la mano -->
  <ellipse cx="200" cy="350" rx="100" ry="80" fill="#FFD9B8" stroke="#D4A574" stroke-width="2" filter="url(#shadow)"/>

  <!-- Dedo pulgar (izquierda) -->
  <path d="M 110 300 Q 60 280 50 200 Q 45 150 70 120"
        fill="#FFD9B8" stroke="#D4A574" stroke-width="2" stroke-linecap="round" filter="url(#shadow)"/>

  <!-- Dedo índice -->
  <path d="M 150 200 Q 140 100 150 30"
        fill="#FFD9B8" stroke="#D4A574" stroke-width="20" stroke-linecap="round" filter="url(#shadow)"/>

  <!-- Dedo medio -->
  <path d="M 200 190 Q 200 80 210 10"
        fill="#FFD9B8" stroke="#D4A574" stroke-width="20" stroke-linecap="round" filter="url(#shadow)"/>

  <!-- Dedo anular -->
  <path d="M 250 200 Q 260 100 250 30"
        fill="#FFD9B8" stroke="#D4A574" stroke-width="20" stroke-linecap="round" filter="url(#shadow)"/>

  <!-- Dedo meñique (derecha) -->
  <path d="M 290 300 Q 340 280 350 200 Q 355 150 330 120"
        fill="#FFD9B8" stroke="#D4A574" stroke-width="18" stroke-linecap="round" filter="url(#shadow)"/>

  <!-- Líneas de la palma (detalles) -->
  <path d="M 140 320 Q 200 360 260 320" stroke="#E0C5A0" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M 160 360 Q 200 380 240 360" stroke="#E0C5A0" stroke-width="2" fill="none" opacity="0.6"/>

  <!-- Uñas -->
  <ellipse cx="150" cy="25" rx="8" ry="12" fill="#F4D9C3" stroke="#D4A574" stroke-width="1"/>
  <ellipse cx="210" cy="10" rx="8" ry="12" fill="#F4D9C3" stroke="#D4A574" stroke-width="1"/>
  <ellipse cx="250" cy="25" rx="8" ry="12" fill="#F4D9C3" stroke="#D4A574" stroke-width="1"/>
</svg>
