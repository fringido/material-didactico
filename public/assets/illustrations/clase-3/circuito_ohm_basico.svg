<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" width="480" height="260" font-family="monospace, sans-serif">
  <rect width="480" height="260" fill="#0f172a" rx="12"/>
  <text x="240" y="26" font-size="14" font-weight="bold" fill="#f1f5f9" text-anchor="middle">Circuito Básico con Medidores</text>
  <!-- Top wire -->
  <line x1="50" y1="65" x2="430" y2="65" stroke="#475569" stroke-width="2"/>
  <!-- Bottom wire -->
  <line x1="50" y1="195" x2="430" y2="195" stroke="#475569" stroke-width="2"/>
  <!-- Vs source (left) -->
  <line x1="65" y1="65"  x2="65" y2="100" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="65" cy="130" r="25" stroke="#38bdf8" stroke-width="2" fill="none"/>
  <text x="65" y="126" font-size="12" fill="#38bdf8" text-anchor="middle">+</text>
  <text x="65" y="140" font-size="9"  fill="#38bdf8" text-anchor="middle">Vs</text>
  <line x1="65" y1="155" x2="65" y2="195" stroke="#38bdf8" stroke-width="2"/>
  <text x="38" y="134" font-size="10" fill="#38bdf8" text-anchor="end">12V</text>
  <!-- R resistor (top, horizontal) -->
  <line x1="140" y1="65" x2="180" y2="65" stroke="#a78bfa" stroke-width="2"/>
  <polyline points="180,65 187,53 195,77 203,53 211,77 219,53 227,77 235,65" stroke="#a78bfa" stroke-width="2" fill="none"/>
  <line x1="235" y1="65" x2="310" y2="65" stroke="#a78bfa" stroke-width="2"/>
  <text x="207" y="49" font-size="11" fill="#a78bfa" text-anchor="middle">R = 24Ω</text>
  <!-- Ammeter (series, horizontal) -->
  <circle cx="360" cy="65" r="18" stroke="#fbbf24" stroke-width="2" fill="#1c1400"/>
  <text x="360" y="61" font-size="9"  fill="#fbbf24" text-anchor="middle">A</text>
  <text x="360" y="73" font-size="8"  fill="#fbbf24" text-anchor="middle">meter</text>
  <text x="360" y="45" font-size="9"  fill="#fbbf24" text-anchor="middle">0.5A</text>
  <line x1="310" y1="65" x2="342" y2="65" stroke="#fbbf24" stroke-width="2"/>
  <line x1="378" y1="65" x2="420" y2="65" stroke="#fbbf24" stroke-width="2"/>
  <!-- Voltmeter (parallel across R) -->
  <line x1="140" y1="65"  x2="140" y2="105" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="4,3"/>
  <circle cx="140" cy="130" r="18" stroke="#4ade80" stroke-width="2" fill="#001a0a"/>
  <text x="140" y="126" font-size="9"  fill="#4ade80" text-anchor="middle">V</text>
  <text x="140" y="138" font-size="8"  fill="#4ade80" text-anchor="middle">meter</text>
  <line x1="140" y1="148" x2="140" y2="195" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="235" y1="65"  x2="235" y2="105" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="235" y1="148" x2="235" y2="195" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="110" y="134" font-size="9" fill="#4ade80" text-anchor="end">12V</text>
  <!-- Ground -->
  <line x1="240" y1="195" x2="240" y2="210" stroke="#64748b" stroke-width="2"/>
  <line x1="228" y1="210" x2="252" y2="210" stroke="#64748b" stroke-width="3"/>
  <line x1="233" y1="215" x2="247" y2="215" stroke="#64748b" stroke-width="2"/>
  <!-- Ohm formula -->
  <text x="240" y="248" font-size="11" fill="#94a3b8" text-anchor="middle">V = I · R → 12V = 0.5A × 24Ω ✓</text>
</svg>
