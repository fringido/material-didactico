<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" width="520" height="260" font-family="monospace, sans-serif">
  <rect width="520" height="260" fill="#0f172a" rx="12"/>
  <text x="260" y="26" font-size="14" font-weight="bold" fill="#f1f5f9" text-anchor="middle">Circuito en Serie — Misma Corriente</text>
  <!-- Top wire -->
  <line x1="55"  y1="65"  x2="465" y2="65"  stroke="#475569" stroke-width="2"/>
  <!-- Bottom wire -->
  <line x1="55"  y1="195" x2="465" y2="195" stroke="#475569" stroke-width="2"/>
  <!-- Vs left -->
  <line x1="70" y1="65"  x2="70" y2="100" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="70" cy="130" r="25" stroke="#38bdf8" stroke-width="2" fill="none"/>
  <text x="70" y="126" font-size="12" fill="#38bdf8" text-anchor="middle">+</text>
  <text x="70" y="140" font-size="9"  fill="#38bdf8" text-anchor="middle">Vs=12V</text>
  <line x1="70" y1="155" x2="70" y2="195" stroke="#38bdf8" stroke-width="2"/>
  <!-- R1 -->
  <line x1="100" y1="65" x2="145" y2="65" stroke="#a78bfa" stroke-width="2"/>
  <polyline points="145,65 152,53 160,77 168,53 176,77 184,53 192,77 200,65" stroke="#a78bfa" stroke-width="2" fill="none"/>
  <line x1="200" y1="65" x2="240" y2="65" stroke="#a78bfa" stroke-width="2"/>
  <text x="173" y="49" font-size="11" fill="#a78bfa" text-anchor="middle">R1=4Ω</text>
  <text x="173" y="88" font-size="9"  fill="#f87171" text-anchor="middle">V₁=4V</text>
  <!-- R2 -->
  <line x1="250" y1="65" x2="290" y2="65" stroke="#4ade80" stroke-width="2"/>
  <polyline points="290,65 297,53 305,77 313,53 321,77 329,53 337,77 345,65" stroke="#4ade80" stroke-width="2" fill="none"/>
  <line x1="345" y1="65" x2="385" y2="65" stroke="#4ade80" stroke-width="2"/>
  <text x="317" y="49" font-size="11" fill="#4ade80" text-anchor="middle">R2=6Ω</text>
  <text x="317" y="88" font-size="9"  fill="#f87171" text-anchor="middle">V₂=6V</text>
  <!-- R3 -->
  <line x1="390" y1="65" x2="415" y2="65" stroke="#fbbf24" stroke-width="2"/>
  <polyline points="415,65 422,53 430,77 438,53 446,77 450,65" stroke="#fbbf24" stroke-width="2" fill="none"/>
  <line x1="450" y1="65" x2="465" y2="65" stroke="#fbbf24" stroke-width="2"/>
  <text x="432" y="49" font-size="11" fill="#fbbf24" text-anchor="middle">R3=2Ω</text>
  <text x="432" y="88" font-size="9"  fill="#f87171" text-anchor="middle">V₃=2V</text>
  <!-- Current arrow -->
  <text x="260" y="145" font-size="12" fill="#7dd3fc" text-anchor="middle" font-weight="bold">I = 1A (misma en todo el circuito) →</text>
  <!-- Ground -->
  <line x1="260" y1="195" x2="260" y2="210" stroke="#64748b" stroke-width="2"/>
  <line x1="248" y1="210" x2="272" y2="210" stroke="#64748b" stroke-width="3"/>
  <line x1="253" y1="215" x2="267" y2="215" stroke="#64748b" stroke-width="2"/>
  <!-- Summary -->
  <text x="260" y="244" font-size="11" fill="#94a3b8" text-anchor="middle">R_T = R1+R2+R3 = 12Ω  |  I = Vs/R_T = 1A  |  V₁+V₂+V₃ = 12V ✓</text>
</svg>
