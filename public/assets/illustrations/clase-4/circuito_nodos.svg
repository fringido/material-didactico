<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 300" width="580" height="300" font-family="monospace, sans-serif">
  <style>
    .lbl { font-size: 11px; fill: #e2e8f0; }
    .node-lbl { font-size: 12px; font-weight: bold; fill: #fbbf24; }
    .gnd-lbl { font-size: 10px; fill: #64748b; }
    .title { font-size: 14px; font-weight: bold; fill: #f1f5f9; }
  </style>
  <rect width="580" height="300" fill="#0f172a" rx="12"/>
  <text x="290" y="26" class="title" text-anchor="middle">Circuito con Nodos Marcados</text>

  <!-- Wires -->
  <!-- Top rail: left→right -->
  <line x1="60"  y1="70"  x2="520" y2="70"  stroke="#475569" stroke-width="2"/>
  <!-- Bottom rail -->
  <line x1="60"  y1="240" x2="520" y2="240" stroke="#475569" stroke-width="2"/>
  <!-- Left vertical (Vs) -->
  <line x1="60"  y1="70"  x2="60"  y2="100" stroke="#475569" stroke-width="2"/>
  <line x1="60"  y1="175" x2="60"  y2="240" stroke="#475569" stroke-width="2"/>
  <!-- Middle branch R3 -->
  <line x1="290" y1="70"  x2="290" y2="100" stroke="#475569" stroke-width="2"/>
  <line x1="290" y1="165" x2="290" y2="240" stroke="#475569" stroke-width="2"/>
  <!-- Right vertical (R4) -->
  <line x1="520" y1="70"  x2="520" y2="100" stroke="#475569" stroke-width="2"/>
  <line x1="520" y1="165" x2="520" y2="240" stroke="#475569" stroke-width="2"/>

  <!-- Source Vs -->
  <circle cx="60" cy="138" r="30" stroke="#38bdf8" stroke-width="2" fill="none"/>
  <text x="60" y="133" font-size="11" fill="#38bdf8" text-anchor="middle">+</text>
  <text x="60" y="148" font-size="10" fill="#38bdf8" text-anchor="middle">Vs=12V</text>

  <!-- R1 horizontal (top, left→mid) -->
  <line x1="80"  y1="70" x2="120" y2="70" stroke="#a78bfa" stroke-width="2"/>
  <polyline points="120,70 127,58 135,82 143,58 151,82 159,58 167,82 175,70" stroke="#a78bfa" stroke-width="2" fill="none"/>
  <line x1="175" y1="70" x2="200" y2="70" stroke="#a78bfa" stroke-width="2"/>
  <text x="150" y="54" class="lbl" fill="#a78bfa" text-anchor="middle">R1=4Ω</text>

  <!-- R2 horizontal (top, mid→right) -->
  <line x1="380" y1="70" x2="420" y2="70" stroke="#a78bfa" stroke-width="2"/>
  <polyline points="420,70 427,58 435,82 443,58 451,82 459,58 467,82 475,70" stroke="#a78bfa" stroke-width="2" fill="none"/>
  <line x1="475" y1="70" x2="500" y2="70" stroke="#a78bfa" stroke-width="2"/>
  <text x="450" y="54" class="lbl" fill="#a78bfa" text-anchor="middle">R2=6Ω</text>

  <!-- R3 vertical (middle branch) -->
  <polyline points="290,100 278,108 302,116 278,124 302,132 278,140 302,148 290,157" stroke="#4ade80" stroke-width="2" fill="none"/>
  <text x="308" y="130" class="lbl" fill="#4ade80">R3=8Ω</text>

  <!-- R4 vertical (right branch) -->
  <polyline points="520,100 508,108 532,116 508,124 532,132 508,140 532,148 520,157" stroke="#4ade80" stroke-width="2" fill="none"/>
  <text x="536" y="130" class="lbl" fill="#4ade80">R4=12Ω</text>

  <!-- Current source I1 between mid and right top -->
  <line x1="290" y1="70" x2="330" y2="70" stroke="#f59e0b" stroke-width="2"/>
  <line x1="380" y1="70" x2="350" y2="70" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="355" cy="70" r="18" stroke="#f59e0b" stroke-width="2" fill="none"/>
  <line x1="347" y1="70" x2="362" y2="70" stroke="#f59e0b" stroke-width="2"/>
  <polygon points="364,70 356,65 356,75" fill="#f59e0b"/>
  <text x="355" y="54" class="lbl" fill="#f59e0b" text-anchor="middle">I1=2A</text>

  <!-- NODES -->
  <!-- Node 0: GND (ref) -->
  <circle cx="290" cy="240" r="6" fill="#64748b"/>
  <line x1="278" y1="252" x2="302" y2="252" stroke="#64748b" stroke-width="3"/>
  <line x1="284" y1="258" x2="296" y2="258" stroke="#64748b" stroke-width="2"/>
  <text x="290" y="272" class="gnd-lbl" text-anchor="middle">Ref (0V)</text>

  <!-- Node 1 (top left, after R1) -->
  <circle cx="200" cy="70" r="8" fill="#fbbf24" stroke="#0f172a" stroke-width="2"/>
  <text x="200" y="55" class="node-lbl" text-anchor="middle">V₁</text>

  <!-- Node 2 (top mid, junction of R1/I1/R3) -->
  <circle cx="290" cy="70" r="8" fill="#fbbf24" stroke="#0f172a" stroke-width="2"/>
  <text x="290" y="55" class="node-lbl" text-anchor="middle">V₂</text>

  <!-- Node 3 (top right, after I1/R4) -->
  <circle cx="520" cy="70" r="8" fill="#fbbf24" stroke="#0f172a" stroke-width="2"/>
  <text x="520" y="55" class="node-lbl" text-anchor="middle">V₃</text>

  <!-- Wire from Node1 leftward to Vs top -->
  <line x1="60" y1="70" x2="200" y2="70" stroke="#475569" stroke-width="2"/>

  <!-- Equation hint -->
  <text x="290" y="292" font-size="10" fill="#64748b" text-anchor="middle">LCK: ΣI_entran = ΣI_salen en cada nodo</text>
</svg>
