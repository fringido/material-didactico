<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="560" height="300" font-family="monospace, sans-serif">
  <style>
    .label { font-size: 13px; fill: #e2e8f0; }
    .sublabel { font-size: 11px; fill: #94a3b8; }
    .title { font-size: 14px; font-weight: bold; }
    .wire { stroke: #64748b; stroke-width: 2; fill: none; }
    .eq { font-size: 12px; fill: #fbbf24; text-anchor: middle; }
  </style>
  <rect width="560" height="300" fill="#0f172a" rx="12"/>

  <!-- Title -->
  <text x="280" y="28" font-size="15" fill="#f1f5f9" font-weight="bold" text-anchor="middle" font-family="monospace">Transformación de Fuentes: Thevenin ↔ Norton</text>

  <!-- ===== LEFT: THEVENIN ===== -->
  <rect x="15" y="45" width="230" height="200" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="130" y="68" class="title" fill="#a78bfa" text-anchor="middle">Thevenin</text>

  <!-- Top wire -->
  <line x1="30" y1="90" x2="230" y2="90" stroke="#a78bfa" stroke-width="2"/>
  <!-- Bottom wire -->
  <line x1="30" y1="220" x2="230" y2="220" stroke="#a78bfa" stroke-width="2"/>

  <!-- V_TH source -->
  <line x1="55" y1="90" x2="55" y2="125" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="55" cy="155" r="25" stroke="#38bdf8" stroke-width="2" fill="none"/>
  <text x="55" y="150" font-size="13" fill="#38bdf8" text-anchor="middle">+</text>
  <text x="55" y="163" font-size="11" fill="#38bdf8" text-anchor="middle">V_TH</text>
  <line x1="55" y1="180" x2="55" y2="220" stroke="#38bdf8" stroke-width="2"/>

  <!-- R_TH (horizontal, top) -->
  <line x1="80" y1="90" x2="105" y2="90" stroke="#a78bfa" stroke-width="2"/>
  <polyline points="105,90 110,80 116,100 122,80 128,100 134,80 140,100 145,90" stroke="#a78bfa" stroke-width="2" fill="none"/>
  <line x1="145" y1="90" x2="175" y2="90" stroke="#a78bfa" stroke-width="2"/>
  <text x="125" y="75" class="sublabel" fill="#a78bfa" text-anchor="middle">R_TH</text>

  <!-- Terminal A/B -->
  <circle cx="200" cy="90" r="5" fill="#38bdf8"/>
  <text x="210" y="94" class="label" fill="#38bdf8">A</text>
  <circle cx="200" cy="220" r="5" fill="#38bdf8"/>
  <text x="210" y="224" class="label" fill="#38bdf8">B</text>

  <!-- ===== ARROW CENTER ===== -->
  <text x="280" y="148" font-size="28" fill="#fbbf24" text-anchor="middle">⇄</text>

  <!-- Formulas in center -->
  <text x="280" y="175" class="eq">I_N = V_TH / R_TH</text>
  <text x="280" y="192" class="eq">R_N = R_TH</text>
  <text x="280" y="209" class="eq">V_TH = I_N × R_N</text>

  <!-- ===== RIGHT: NORTON ===== -->
  <rect x="315" y="45" width="230" height="200" rx="8" fill="#1e293b" stroke="#4ade80" stroke-width="1.5"/>
  <text x="430" y="68" class="title" fill="#4ade80" text-anchor="middle">Norton</text>

  <!-- Top wire -->
  <line x1="330" y1="90" x2="530" y2="90" stroke="#4ade80" stroke-width="2"/>
  <!-- Bottom wire -->
  <line x1="330" y1="220" x2="530" y2="220" stroke="#4ade80" stroke-width="2"/>

  <!-- Left wire -->
  <line x1="345" y1="90" x2="345" y2="220" stroke="#4ade80" stroke-width="2"/>

  <!-- I_N current source -->
  <line x1="345" y1="90" x2="345" y2="123" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="345" cy="155" r="25" stroke="#38bdf8" stroke-width="2" fill="none"/>
  <line x1="345" y1="168" x2="345" y2="148" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="345,140 340,151 350,151" fill="#38bdf8"/>
  <text x="345" y="172" font-size="10" fill="#38bdf8" text-anchor="middle">I_N</text>
  <line x1="345" y1="180" x2="345" y2="220" stroke="#38bdf8" stroke-width="2"/>

  <!-- R_N (vertical branch) -->
  <line x1="430" y1="90" x2="430" y2="115" stroke="#4ade80" stroke-width="2"/>
  <polyline points="430,115 420,122 440,130 420,138 440,146 420,154 440,162 430,170" stroke="#4ade80" stroke-width="2" fill="none"/>
  <line x1="430" y1="170" x2="430" y2="220" stroke="#4ade80" stroke-width="2"/>
  <text x="448" y="148" class="sublabel" fill="#4ade80">R_N</text>

  <!-- Terminal A/B -->
  <circle cx="510" cy="90" r="5" fill="#38bdf8"/>
  <text x="520" y="94" class="label" fill="#38bdf8">A</text>
  <circle cx="510" cy="220" r="5" fill="#38bdf8"/>
  <text x="520" y="224" class="label" fill="#38bdf8">B</text>

  <!-- Bottom note -->
  <text x="280" y="275" font-size="11" fill="#94a3b8" text-anchor="middle">Ambos circuitos son eléctricamente equivalentes desde las terminales A-B</text>
</svg>
