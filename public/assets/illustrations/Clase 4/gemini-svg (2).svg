    .text { font-family: sans-serif; font-size: 16px; fill: #333; font-weight: bold; }
    .label { font-family: sans-serif; font-size: 14px; fill: #666; font-style: italic; }
  </style>

  <path class="line" d="M 100 200 L 400 200" /> <path class="line" d="M 100 100 L 250 100" /> <path class="line" d="M 250 100 L 400 100" /> <path class="line" d="M 100 100 L 100 130" /> <path class="line" d="M 100 170 L 100 200" />
  
  <circle cx="100" cy="150" r="20" class="line" fill="#fff"/>
  <path class="line" d="M 100 160 L 100 140" stroke-width: 2/>
  <polygon points="95,145 105,145 100,135" fill="#333"/>
