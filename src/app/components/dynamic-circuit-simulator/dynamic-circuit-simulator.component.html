<div class="simulator-container">
  <div class="simulator-header">
    <h3 class="simulator-title">🔌 {{ simulacion.titulo || 'Simulador Interactivo' }}</h3>
    <p class="simulator-desc" *ngIf="simulacion.descripcion">{{ simulacion.descripcion }}</p>
  </div>

  <div class="simulator-body">
    <div class="workspace-grid">

      <!-- Diagrama SVG Dinámico -->
      <div class="diagram-panel">
        <h4 class="panel-subtitle">Diagrama del Circuito</h4>

        <div class="svg-diagram-wrapper">
          <svg [attr.viewBox]="'0 0 ' + (simulacion.ancho || 240) + ' ' + (simulacion.alto || 200)" class="circuit-svg">
            <ng-container *ngFor="let el of simulacion.diagrama">

              <!-- Líneas genéricas -->
              <line *ngIf="el.tipo === 'linea'" [attr.x1]="el.x1" [attr.y1]="el.y1" [attr.x2]="el.x2" [attr.y2]="el.y2" stroke="currentColor" stroke-width="2"/>

              <!-- Fuente AC -->
              <ng-container *ngIf="el.tipo === 'fuente_ac'">
                <circle [attr.cx]="el.x" [attr.cy]="el.y" r="16" fill="var(--bg-secondary)" stroke="currentColor" stroke-width="2"/>
                <path [attr.d]="'M ' + (el.x! - 8) + ' ' + el.y + ' Q ' + (el.x! - 4) + ' ' + (el.y! - 8) + ' ' + el.x + ' ' + el.y + ' T ' + (el.x! + 8) + ' ' + el.y" fill="none" stroke="currentColor" stroke-width="2"/>
                <line [attr.x1]="el.x" [attr.y1]="el.y! - 16" [attr.x2]="el.x" [attr.y2]="el.y! - 70" stroke="currentColor" stroke-width="2"/>
                <line [attr.x1]="el.x" [attr.y1]="el.y! + 16" [attr.x2]="el.x" [attr.y2]="el.y! + 70" stroke="currentColor" stroke-width="2"/>
              </ng-container>

              <!-- Resistencia -->
              <ng-container *ngIf="el.tipo === 'resistencia'">
                <rect [attr.x]="el.x" [attr.y]="el.y" width="20" height="40" fill="var(--bg-secondary)" stroke="currentColor" stroke-width="2"/>
                <line [attr.x1]="el.x! + 10" [attr.y1]="el.y! - 30" [attr.x2]="el.x! + 10" [attr.y2]="el.y" stroke="currentColor" stroke-width="2"/>
                <line [attr.x1]="el.x! + 10" [attr.y1]="el.y! + 40" [attr.x2]="el.x! + 10" [attr.y2]="el.y! + 70" stroke="currentColor" stroke-width="2"/>
                <text *ngIf="el.id" [attr.x]="el.x! - 10" [attr.y]="el.y! + 25" fill="currentColor" font-size="10" font-weight="bold">{{ el.id }}</text>
              </ng-container>

              <!-- Diodo -->
              <ng-container *ngIf="el.tipo === 'diodo'">
                <polygon [attr.points]="el.x + ',' + el.y + ' ' + el.x + ',' + (el.y! + 20) + ' ' + (el.x! + 15) + ',' + (el.y! + 10)" fill="currentColor" stroke="currentColor" stroke-width="2" opacity="0.3"/>
                <line [attr.x1]="el.x! + 15" [attr.y1]="el.y" [attr.x2]="el.x! + 15" [attr.y2]="el.y! + 20" stroke="currentColor" stroke-width="3"/>
                <text *ngIf="el.id" [attr.x]="el.x! + 8" [attr.y]="el.y! + 32" fill="#EF4444" font-size="10" font-weight="bold" text-anchor="middle">{{ el.id }}</text>
              </ng-container>

              <!-- Nodo -->
              <ng-container *ngIf="el.tipo === 'nodo'">
                <circle [attr.cx]="el.x" [attr.cy]="el.y" r="4" fill="#34D399"/>
                <text *ngIf="el.valor" [attr.x]="el.x! + 8" [attr.y]="el.y! - 8" fill="#34D399" font-size="10" font-weight="bold">{{ el.valor }}</text>
              </ng-container>

              <!-- Tierra -->
              <ng-container *ngIf="el.tipo === 'tierra'">
                <line [attr.x1]="el.x" [attr.y1]="el.y" [attr.x2]="el.x" [attr.y2]="el.y! + 10" stroke="currentColor" stroke-width="2"/>
                <line [attr.x1]="el.x! - 12" [attr.y1]="el.y! + 10" [attr.x2]="el.x! + 12" [attr.y2]="el.y! + 10" stroke="currentColor" stroke-width="3"/>
                <line [attr.x1]="el.x! - 6" [attr.y1]="el.y! + 15" [attr.x2]="el.x! + 6" [attr.y2]="el.y! + 15" stroke="currentColor" stroke-width="2"/>
              </ng-container>

            </ng-container>
          </svg>
        </div>
      </div>

      <!-- Controles -->
      <div class="controls-panel">
        <h4 class="panel-subtitle">Ajustar Parámetros</h4>

        <div class="control-group" *ngFor="let ctrl of simulacion.controles">
          <label class="control-label" [attr.for]="'ctrl-' + ctrl.id">{{ ctrl.label }}: <span class="control-value">{{ controlValues()[ctrl.id] }} {{ ctrl.unidad || '' }}</span></label>
            <input [id]="'ctrl-' + ctrl.id" type="range"
             title="{{ ctrl.label }}"
                 [min]="ctrl.min"
                 [max]="ctrl.max"
                 [step]="ctrl.step"
                 [value]="controlValues()[ctrl.id]"
                 (input)="updateControl(ctrl.id, $any($event.target).value)"
                 class="control-slider">
        </div>

        <button (click)="togglePlay()" class="btn-play mt-4" *ngIf="simulacion.graficas && simulacion.graficas.length > 0">
          {{ isPlaying() ? '⏸ Pausar Animación' : '▶ Reproducir Animación' }}
        </button>
      </div>
    </div>

    <!-- Gráficas Animadas -->
    <div class="waves-panel" *ngIf="simulacion.graficas && simulacion.graficas.length > 0">
      <h4 class="panel-subtitle text-center">Formas de Onda</h4>
      <div class="waves-grid">
        <div class="wave-box" *ngFor="let g of simulacion.graficas">
          <span class="wave-box__tag" [style.backgroundColor]="g.color + '22'" [style.color]="g.color">{{ g.label }}</span>
          <svg class="wave-svg" viewBox="0 0 300 100">
            <line x1="0" y1="50" x2="300" y2="50" stroke="#444" stroke-width="1" stroke-dasharray="2,2"/>
            <path [attr.d]="generateWavePath(g)" fill="none" [attr.stroke]="g.color" stroke-width="2"/>
          </svg>
        </div>
      </div>
    </div>

    <!-- Métricas -->
    <div class="metrics-panel" *ngIf="simulacion.metricas && simulacion.metricas.length > 0">
      <h4 class="panel-subtitle">Métricas Calculadas</h4>
      <div class="metrics-grid">
        <div class="metric-card" *ngFor="let m of metricasEvaluadas()">
          <p class="metric-label">{{ m.label }}</p>
          <p class="metric-value">{{ m.valorCalculado.toFixed(2) }} {{ m.unidad || '' }}</p>
          <div class="metric-formula" [appKatex]="m.formula_katex"></div>
        </div>
      </div>
    </div>

    <!-- Matriz Dinámica -->
    <div class="matrix-panel-wrapper" *ngIf="simulacion.matriz_dinamica">
      <app-matrix-visualizer [matriz]="simulacion.matriz_dinamica" [controlValues]="controlValues()"></app-matrix-visualizer>
    </div>

  </div>
</div>
